{{- if .Values.registrySecret.create }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "a8s-admin-frontend-chart.registrySecretName" . }}
  labels:
    {{- include "a8s-admin-frontend-chart.labels" . | nindent 4 }}
type: kubernetes.io/dockerconfigjson
data:
  .dockerconfigjson: {{ include "a8s-admin-frontend-chart.registryDockerConfigJson" . | quote }}
{{- end }}
